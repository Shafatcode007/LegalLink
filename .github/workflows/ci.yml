name: LegalLink CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  db-rls-guard:
    name: Database Migrations & RLS Drift Guard
    runs-on: ubuntu-latest

    env:
      PG_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Dual-Folder Migration Sync
        run: |
          chmod +x scripts/verify_migration_sync.sh
          ./scripts/verify_migration_sync.sh

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Cache Supabase Docker images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: supabase-docker-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}
          restore-keys: |
            supabase-docker-${{ runner.os }}-

      - name: Load cached Docker images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/docker-images/images.tar ]; then
            docker load -i /tmp/docker-images/images.tar
          fi

      - name: Start Supabase Local Engine
        run: |
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor || {
            echo "Initial startup attempt failed, retrying after pause..."
            sleep 5
            supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor
          }

      - name: Save Docker images to cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker save -o /tmp/docker-images/images.tar $(docker images -q) || true

      - name: Apply Migrations (deterministic, no seed)
        run: supabase db reset --local --no-seed

      - name: Seed Demo & Test Data
        run: psql -v ON_ERROR_STOP=1 "$PG_URL" -f db/seed.sql

      - name: RLS Test Suite - Run 1 (Execution)
        run: psql -v ON_ERROR_STOP=1 "$PG_URL" -f db/tests/rls_test.sql

      - name: RLS Test Suite - Run 2 (Idempotency / Drift Guard)
        run: psql -v ON_ERROR_STOP=1 "$PG_URL" -f db/tests/rls_test.sql
