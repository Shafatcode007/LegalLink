</div>

<script>
  function toggleLanguage(lang) {
    const btnBn = document.getElementById('btn-bn');
    const btnEn = document.getElementById('btn-en');
    
    const brandTitle = document.getElementById('brand-title');
    const heroWelcome = document.getElementById('hero-welcome');
    const heroSubtitle = document.getElementById('hero-subtitle');
    
    const item1Title = document.getElementById('item1-title');
    const item1Desc = document.getElementById('item1-desc');
    const item2Title = document.getElementById('item2-title');
    const item2Desc = document.getElementById('item2-desc');
    const item3Title = document.getElementById('item3-title');
    const item3Desc = document.getElementById('item3-desc');
    
    const ctaButtonText = document.getElementById('cta-button-text');
    const signinLink = document.getElementById('signin-link');

    if (lang === 'en') {
      btnEn.className = 'flex items-center justify-center px-space-md py-1.5 rounded-full bg-surface-container-lowest text-primary font-label-md text-label-md transition-all duration-200';
      btnEn.style.boxShadow = '0 2px 8px rgba(26, 30, 40, 0.08)';
      
      btnBn.className = 'flex items-center justify-center px-space-md py-1.5 rounded-full text-on-surface-variant font-label-md text-label-md transition-all duration-200 hover:text-primary';
      btnBn.style.boxShadow = 'none';

      brandTitle.textContent = 'Ain Sohay';
      heroWelcome.textContent = 'Welcome';
      heroSubtitle.textContent = 'Simple, fast & reliable legal assistance';

      item1Title.textContent = 'Verified Advocates';
      item1Desc.textContent = 'Bar Council licensed experienced lawyers';

      item2Title.textContent = 'Case & Hearing Updates';
      item2Desc.textContent = 'Timely real-time legal notifications';

      item3Title.textContent = '24/7 Legal Assistance';
      item3Desc.textContent = 'Immediate support in any critical matter';

      ctaButtonText.textContent = 'Get Started';
      signinLink.innerHTML = 'Already have an account? <span class="text-secondary font-medium">Sign In</span>';
    } else {
      btnBn.className = 'flex items-center justify-center px-space-md py-1.5 rounded-full bg-surface-container-lowest text-primary font-label-md text-label-md transition-all duration-200';
      btnBn.style.boxShadow = '0 2px 8px rgba(26, 30, 40, 0.08)';
      
      btnEn.className = 'flex items-center justify-center px-space-md py-1.5 rounded-full text-on-surface-variant font-label-md text-label-md transition-all duration-200 hover:text-primary';
      btnEn.style.boxShadow = 'none';

      brandTitle.textContent = 'আইন সহায়';
      heroWelcome.textContent = 'স্বাগতম';
      heroSubtitle.textContent = 'সহজ, দ্রুত ও নির্ভরযোগ্য আইনি সেবা';

      item1Title.textContent = 'যাচাইকৃত আইনজীবী';
      item1Desc.textContent = 'বার কাউন্সিল সনদপ্রাপ্ত দক্ষ উকিল';

      item2Title.textContent = 'শুনানি ও মামলার আপডেট';
      item2Desc.textContent = 'সময়মতো রিয়েলটাইম নোটিফিকেশন';

      item3Title.textContent = '২৪/৭ জরুরি আইনি সহায়তা';
      item3Desc.textContent = 'যেকোনো আইনি জটিলতায় দ্রুত পাশে';

      ctaButtonText.textContent = 'শুরু করুন';
      signinLink.innerHTML = 'ইতিমধ্যে অ্যাকাউন্ট আছে? <span class="text-secondary font-medium">সাইন ইন</span>';
    }
  }
</script></main></body></html>
