</head><body class="bg-surface-container font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><div class="fixed top-0 right-0 p-margin pt-safe z-50"><button aria-label="Dismiss" class="w-11 h-11 rounded-full bg-surface-container-high/80 backdrop-blur-md flex items-center justify-center text-primary-container hover:text-secondary shadow-[0_2px_8px_rgba(26,30,40,0.06)] active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">close</span></button></div><main class="flex-1 flex flex-col relative w-full px-margin bg-surface-container"><div class="flex flex-col w-full items-center justify-between pb-8 select-none">
<!-- Minimalist Status Line / Micro-Context -->
<div class="w-full pt-4 flex flex-col items-center justify-center">
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container-high/80 text-on-surface-variant shadow-[0_2px_8px_rgba(26,30,40,0.06)] backdrop-blur-md"><span class="w-2 h-2 rounded-full bg-error animate-pulse"></span><span class="font-label-sm text-label-sm tracking-wider uppercase font-medium">আইন সহায় SOS • Active Standby</span></div>
</div>
<!-- Primary Canvas Area: 80px visual breathing room around the central trigger -->
<div class="w-full flex flex-col items-center justify-center py-20 relative">
<!-- Outer Breathing Aura Rings -->
<div class="relative flex items-center justify-center">
<!-- Breathing Ambient Ring (12% opacity) -->
<div class="absolute w-[248px] h-[248px] rounded-full transition-all duration-700 pointer-events-none" id="sos-ring" style="background: radial-gradient(circle, rgba(147, 31, 50, 0.14) 0%, rgba(122, 34, 48, 0.08) 55%, rgba(122, 34, 48, 0) 72%); filter: blur(6px);"></div>
<!-- Subtle SVG Progress Track for Press & Hold Feedback -->
<svg class="absolute w-[224px] h-[224px] pointer-events-none -rotate-90" viewBox="0 0 224 224">
<circle cx="112" cy="112" fill="none" r="104" stroke="rgba(186, 26, 26, 0.15)" stroke-width="3"></circle>
<circle class="transition-all ease-out" cx="112" cy="112" fill="none" id="hold-progress-bar" r="104" stroke="#7A2230" stroke-dasharray="653.45" stroke-dashoffset="653.45" stroke-linecap="round" stroke-width="3.5"></circle>
</svg>
<!-- Central Burgundy 200dp Action Disc -->
<button aria-label="Trigger SOS Emergency Procedure" class="relative w-[200px] h-[200px] rounded-full flex flex-col items-center justify-center text-on-error active:scale-[0.97] transition-transform duration-150 cursor-pointer overflow-hidden focus:outline-none" id="sos-trigger" style="background: radial-gradient(100% 100% at 32% 24%, #9E2437 0%, #7A2230 60%, #5E1420 100%); box-shadow: 0 0 0 16px rgba(122,34,48,0.06), 0 20px 48px rgba(122,34,48,0.18);" type="button">
<!-- Specular Highlight Overlay -->
<div class="absolute inset-0 rounded-full bg-gradient-to-b from-white/15 to-transparent pointer-events-none"></div>
<!-- Siren & Balance Glyph (48px) -->
<span class="material-symbols-outlined text-[48px] leading-none mb-1 text-on-error drop-shadow-sm" style="font-variation-settings: 'wght' 300, 'FILL' 0;">
          emergency_home
        </span>
<!-- SOS Typographic Anchor -->
<span class="font-headline-lg text-headline-lg tracking-[0.12em] text-on-error pl-1 font-semibold leading-none drop-shadow-sm">
          SOS
        </span>
</button>
</div>
<!-- Tactile Hold Indicator (Stone muted typography) -->
<div class="mt-12 flex flex-col items-center text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant font-normal tracking-tight" id="sos-caption">
        ধরে রাখুন <span class="text-outline font-medium tracking-normal">(Hold to arm)</span>
</p>
<!-- Micro-tactile state indicator dots -->
<div class="flex items-center gap-1.5 mt-2 opacity-60">
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span class="w-1.5 h-1.5 rounded-full bg-outline"></span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
</div>
</div>
</div>
<!-- Direct Oxford Fallback Hotline Button -->
<div class="w-full flex flex-col items-center gap-3"><a class="inline-flex items-center justify-between px-7 h-[52px] w-full max-w-[320px] rounded-full bg-primary-container text-surface-container-lowest shadow-[0_2px_8px_rgba(26,30,40,0.06)] active:opacity-85 active:scale-[0.97] transition-all duration-150" href="tel:109"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><span class="material-symbols-outlined text-[18px] text-surface-container-lowest" style="font-variation-settings: 'FILL' 1;">call</span></div><span class="font-label-lg text-label-lg tracking-normal font-medium">জাতীয় হেল্পলাইন</span></div><span class="font-bold tracking-wider text-[17px] text-secondary-container">109</span></a><span class="font-body-sm text-body-sm text-on-surface-variant/80 tracking-normal mt-1">টোল ফ্রি • ২৪ ঘণ্টা আইনগত সহায়তা ও নিরাপত্তা</span></div>
</div>
<script>
  (function() {
    const trigger = document.getElementById('sos-trigger');
    const ring = document.getElementById('sos-ring');
    const progressBar = document.getElementById('hold-progress-bar');
    const caption = document.getElementById('sos-caption');
    
    const circumference = 653.45;
    const holdDuration = 600; // 600ms required hold
    let holdTimer = null;
    let startTimestamp = null;
    let animationFrame = null;
    let isTriggered = false;

    function updateProgress(now) {
      if (!startTimestamp) startTimestamp = now;
      const elapsed = now - startTimestamp;
      const progress = Math.min(elapsed / holdDuration, 1);
      
      // Update dashoffset
      const offset = circumference - (progress * circumference);
      progressBar.style.strokeDashoffset = offset;

      if (progress < 1) {
        animationFrame = requestAnimationFrame(updateProgress);
      } else {
        triggerArmedState();
      }
    }

    function triggerArmedState() {
      if (isTriggered) return;
      isTriggered = true;
      if (navigator.vibrate) navigator.vibrate([40, 60, 120]);
      
      caption.innerHTML = '<span class="text-error font-medium">জরুরি সংকেত প্রেরিত হচ্ছে...</span>';
      ring.style.transform = 'scale(1.35)';
      ring.style.opacity = '0.5';
      trigger.style.transform = 'scale(0.94)';

      setTimeout(() => {
        // Fallback simulate action
        caption.innerHTML = '<span class="text-tertiary-container font-medium">সহায়তা টিম ও লোকেশন সংযুক্ত</span>';
      }, 1200);
    }

    function startPress(e) {
      if (isTriggered) return;
      if (e.type === 'touchstart') e.preventDefault();
      startTimestamp = null;
      animationFrame = requestAnimationFrame(updateProgress);
      ring.style.transform = 'scale(1.15)';
      ring.style.transition = 'transform 600ms cubic-bezier(0.16, 1, 0.3, 1)';
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function cancelPress() {
      if (isTriggered) return;
      if (animationFrame) cancelAnimationFrame(animationFrame);
      startTimestamp = null;
      progressBar.style.strokeDashoffset = circumference;
      ring.style.transform = 'scale(1)';
      ring.style.transition = 'transform 300ms ease';
    }

    // Touch events
    trigger.addEventListener('touchstart', startPress, { passive: false });
    trigger.addEventListener('touchend', cancelPress);
    trigger.addEventListener('touchcancel', cancelPress);

    // Mouse fallback for preview
    trigger.addEventListener('mousedown', startPress);
    window.addEventListener('mouseup', cancelPress);
  })();
</script></main></body></html>
